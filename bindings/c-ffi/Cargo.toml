[package]
name = "rln-c-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
build = "build.rs"
publish = false

[lib]
crate-type = ["staticlib"]
name = "rlncffi"

[dependencies]
rgb-lightning-node = { path = "../..", features = ["uniffi", "vls"] }
# Direct deps on `lightning` and `lightning-invoice` so we can construct the
# typed wrappers (`PaymentHash`, `ChannelId`, `Bolt11Invoice`) by their real
# crate paths — `rgb_lightning_node::PaymentHash` etc. are type aliases and
# Rust 2021 doesn't allow tuple-struct construction through an alias.
# Resolved through the `[patch.crates-io]` block below so they unify with
# the parent crate's pin onto Roman's rust-lightning fork.
lightning = { version = "0.2.0" }
lightning-invoice = { version = "0.34.0", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = { package = "hex-conservative", version = "0.3.0" }

[build-dependencies]
cbindgen = "0.29.0"

[features]
default = []

# Empty workspace declaration: this sub-crate is intentionally its own
# Cargo workspace, separate from the parent `rgb-lightning-node` package
# (which depends on `rust-lightning` via path; that submodule is its own
# workspace with its own `[workspace.lints]`). The committed Cargo.lock
# ensures `rgb-lib` resolves to the same revision the parent crate uses.
[workspace]

# Mirror the parent crate's `[patch.crates-io]` block so registry crates
# resolve to the same revision the parent is pinned against. The parent
# now patches all `lightning*` crates to Roman's
# `rmn-boiko/rust-lightning.git#feat/external-signer-compatibility`
# (instead of the in-tree submodule), and adds VLS-side rgb-compatibility
# patches that the external-signer flow needs. Keeping these in lock-step
# avoids "two copies of `lightning`" trait-bound errors when building
# the parent crate from inside this c-ffi workspace.
[patch.crates-io]
lightning = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-background-processor = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-block-sync = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-dns-resolver = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-invoice = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-net-tokio = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-persister = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
lightning-rapid-gossip-sync = { git = "https://github.com/rmn-boiko/rust-lightning.git", branch = "feat/external-signer-compatibility" }
vls-core = { git = "https://github.com/rmn-boiko/vls-core.git", branch = "feat/rgb-compatibility" }
vls-protocol-signer = { git = "https://github.com/rmn-boiko/vls-protocol-signer.git", branch = "feat/rgb-compatibility" }
